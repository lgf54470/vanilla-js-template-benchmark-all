name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: extractions/setup-just@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: fmt-check
        run: deno fmt --check
      - name: lint（deno lint + 治理脚本）
        run: just lint
      - name: test
        run: just test
      - name: coverage 阈值
        run: just coverage
