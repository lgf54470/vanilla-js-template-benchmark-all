name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: extractions/setup-just@v2
      - name: 格式检查
        run: just fmt-check
      - name: 静态检查（deno lint + 治理脚本）
        run: just lint
      - name: 全量测试
        run: just test
