name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: extractions/setup-just@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 格式检查（CI 第一步）
        run: just fmt-check

      - name: 静态检查（deno lint + 零依赖治理脚本）
        run: just lint

      - name: 测试（单元 + 集成 + UI 冒烟）
        run: just test
