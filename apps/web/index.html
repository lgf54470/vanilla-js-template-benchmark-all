<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>vanilla-js-template</title>
    <script>
      // PREPAINT 防闪白（docs/CSS.md §1 通道 2）：首帧前把持久化外观写到 <html>。
      // 与 shared/lib/appearance.js 保持严格一致（选项/默认值/键名/类名），
      // 运行时由外观引擎接管；本脚本不得引用外部资源，不抛错（try/catch 兜底）。
      (function () {
        try {
          var d = document.documentElement;
          var opts = {
            theme: ["light", "dark", "system"],
            style: [
              "nova",
              "vega",
              "maia",
              "lyra",
              "mira",
              "luma",
              "sera",
              "rhea",
            ],
            base: ["zinc", "red", "orange", "green", "blue", "violet", "rose"],
            chart: [
              "",
              "amber",
              "blue",
              "cyan",
              "emerald",
              "fuchsia",
              "green",
              "indigo",
              "orange",
              "pink",
              "red",
              "teal",
              "violet",
            ],
            menu: [
              "default",
              "inverted",
              "default-translucent",
              "inverted-translucent",
            ],
            sidebarVariant: ["sidebar", "floating", "inset"],
            sidebarCollapsible: ["offcanvas", "icon", "none"],
          };
          var fonts = {
            inherit: null,
            inter: '"Inter Variable"',
            manrope: '"Manrope Variable"',
            geist: '"Geist Variable"',
          };
          var keys = {
            theme: "pref:theme",
            style: "pref:style",
            base: "pref:base",
            chart: "pref:chart",
            menu: "pref:menu",
            radius: "pref:radius",
            fontSans: "pref:font-sans",
            fontHeading: "pref:font-heading",
            sidebarVariant: "pref:sidebar-variant",
            sidebarCollapsible: "pref:sidebar-collapsible",
          };
          var defaults = {
            theme: "system",
            style: "nova",
            base: "zinc",
            chart: "",
            menu: "default",
            radius: "0.625rem",
            fontSans: "inherit",
            fontHeading: "inherit",
            sidebarVariant: "sidebar",
            sidebarCollapsible: "icon",
          };
          var prefs = {};
          for (var k in keys) {
            var raw = null;
            try {
              raw = localStorage.getItem(keys[k]);
            } catch (e) {
              raw = null;
            }
            prefs[k] = raw !== null && opts[k].indexOf(raw) !== -1
              ? raw
              : defaults[k];
          }
          if (!/^\d*\.?\d+(rem|px)$/.test(prefs.radius)) {
            prefs.radius = defaults.radius;
          }

          ["style", "base", "chart", "menu"].forEach(function (p) {
            for (var i = d.classList.length - 1; i >= 0; i--) {
              var cls = d.classList[i];
              if (cls.indexOf(p + "-") === 0) d.classList.remove(cls);
            }
            if (prefs[p]) d.classList.add(p + "-" + prefs[p]);
          });

          var dark = prefs.theme === "dark" ||
            (prefs.theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          d.classList.toggle("dark", dark);
          d.setAttribute("data-theme", dark ? "dark" : "light");
          d.style.colorScheme = dark ? "dark" : "light";

          d.style.setProperty("--radius", prefs.radius);
          if (fonts[prefs.fontSans]) {
            d.style.setProperty("--font-sans-base", fonts[prefs.fontSans]);
          }
          if (fonts[prefs.fontHeading]) {
            d.style.setProperty(
              "--font-heading-base",
              fonts[prefs.fontHeading],
            );
          }

          d.setAttribute("data-sidebar-variant", prefs.sidebarVariant);
          d.setAttribute("data-sidebar-collapsible", prefs.sidebarCollapsible);
        } catch (e) {
          /* 外观初始化失败不阻塞首帧，落回 CSS 内的 zinc 默认值。 */
        }
      })();
    </script>
    <link
      rel="preload"
      href="/fonts/inter-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/manrope-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/geist-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
