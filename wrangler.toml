# Cloudflare Workers 部署配置（docs/Deployment.md §3）。
# 机密（APP_ENCRYPTION_KEY 等）经 `wrangler secret put` 注入，不写入本文件。
name = "vanilla-js-template"
main = "apps/server/src/platform-adapters/cloudflare.entry.js"
compatibility_date = "2026-08-01"

[vars]
DEPLOY_TARGET = "cloudflare"

[[d1_databases]]
binding = "DB"
database_name = "vanilla-js-template"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[assets]
directory = "dist/web"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"